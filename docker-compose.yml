services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${KAYA_DB_ROOT_PASSWORD}
    ports:
      - "${KAYA_DB_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingest:
    profiles: ["setup"]
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    user: "${KAYA_DOCKER_UID:-1000}:${KAYA_DOCKER_GID:-1000}"
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      HOME: /workspace/.runtime
      KAYA_DB_HOST: mysql
      KAYA_DB_PORT: ${KAYA_DB_PORT:-3306}
      KAYA_DB_USER: ${KAYA_DB_USER}
      KAYA_DB_PASSWORD: ${KAYA_DB_PASSWORD}
      KAYA_DB_NAME: ${KAYA_DB_NAME}
    depends_on:
      mysql:
        condition: service_healthy
    command: ["./scripts/ingest_container.sh"]
    restart: "no"

  copilot:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file:
      - .env
    environment:
      KAYA_DB_HOST: mysql
      KAYA_DB_PORT: ${KAYA_DB_PORT:-3306}
      KAYA_DB_USER: ${KAYA_DB_USER}
      KAYA_DB_PASSWORD: ${KAYA_DB_PASSWORD}
      KAYA_DB_NAME: ${KAYA_DB_NAME}
      KAYA_CHAT_DB: /runtime/kaya_chat.sqlite3
    ports:
      - "${KAYA_STREAMLIT_HOST_PORT:-8501}:8501"
    volumes:
      - copilot_runtime:/runtime
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: tests/Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    env_file:
      - .env
    environment:
      KAYA_DB_HOST: mysql
      KAYA_DB_PORT: ${KAYA_DB_PORT:-3306}
      KAYA_DB_USER: ${KAYA_DB_USER}
      KAYA_DB_PASSWORD: ${KAYA_DB_PASSWORD}
      KAYA_DB_NAME: ${KAYA_DB_NAME}
      KAYA_CHAT_DB: /tmp/kaya-test-chat.sqlite3
    depends_on:
      mysql:
        condition: service_healthy
    command: ["python", "-m", "unittest", "discover", "-v"]
    restart: "no"
volumes:
  mysql_data:
  copilot_runtime:
